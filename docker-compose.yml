services:
  postgres:
    image: postgres:15-alpine
    container_name: challenge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challenge_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: challenge-server
    restart: always
    ports:
      - "6026:6026"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: challenge_tracker
      PORT: 6026
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://server:6026
    container_name: challenge-client
    restart: always
    ports:
      - "2026:2026"
    environment:
      PORT: 2026
      API_BASE_URL: http://server:6026
    depends_on:
      - server

volumes:
  postgres_data:
